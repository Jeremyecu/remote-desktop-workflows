name: WINDOWS RDP - NGROK v3
on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

      - name: Set Administrator Password
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)

      - name: Download ngrok v3
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "."

      - name: Configure ngrok
        run: |
          .\ngrok.exe authtoken $env:NGROK_AUTH_TOKEN
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start ngrok tunnel
        run: |
          Start-Process -NoNewWindow -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389"
          Start-Sleep -Seconds 15
          $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
          $url = $response.tunnels[0].public_url
          Write-Host "========================================"
          Write-Host "🔗 URL NGROK: $url"
          Write-Host "========================================"
          Write-Host "USUARIO: runneradmin"
          Write-Host "CONTRASEÑA: P@ssw0rd123!"
          Write-Host "========================================"
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "✓ Activo - $(Get-Date -Format 'HH:mm:ss')"
          }
